<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Word Order Challenge - Practice English sentence structure patterns." />
  <meta name="theme-color" content="#ec4899" />
  <title>Word Order Challenge — English Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .game-layout { padding: 24px 28px; max-width: 700px; margin: 0 auto; text-align: center; }
    .wo-pattern { font-size: 16px; font-weight: 700; color: var(--color-accent); margin-bottom: 16px; padding: 8px 16px; background: var(--color-accent-bg); border-radius: var(--radius-full); display: inline-block; }
    .wo-words-area, .wo-drop-area { min-height: 60px; padding: 16px; border-radius: var(--radius-md); display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
    .wo-words-area { background: var(--color-words-bg); border: 2px dashed var(--color-words-border); }
    .wo-drop-area { background: var(--color-drop-bg); border: 3px dashed var(--color-drop-border); margin-top: 8px; }
    .wo-words-area .word, .wo-drop-area .word { cursor: pointer; }
    @media (max-width: 640px) { .game-layout { padding: 16px; } }
  </style>
  <script type="module" crossorigin src="/assets/main-Ba8yPvwy.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/style-mL3Nmd8n.css">
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header" style="background: linear-gradient(135deg, #ec4899 0%, #db2777 50%, #be185d 100%);">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">📏</span>
          <div>
            <h1 class="game-title">Word Order Challenge</h1>
            <p class="game-subtitle">Build sentences in the correct order</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
        </div>
      </header>

      <div class="game-layout">
        <div class="wo-pattern" id="woPattern">Pattern: S + V + O</div>

        <div class="section-header" style="justify-content:center;margin-bottom:6px;">
          <h2 class="section-title">Words</h2>
        </div>
        <div class="wo-words-area" id="woWords"></div>

        <div style="padding:6px 0;font-size:18px;color:var(--color-text-muted);">↓</div>

        <div class="section-header" style="justify-content:center;margin-bottom:6px;">
          <h2 class="section-title">Your Sentence</h2>
        </div>
        <div class="wo-drop-area" id="woDrop">
          <div class="drop-placeholder">Click a word to add it here…</div>
        </div>

        <div class="button-group" style="padding-top:20px;">
          <button class="btn btn-primary" id="woCheck">✓ Check</button>
          <button class="btn btn-accent" id="woHint">💡 Hint</button>
          <button class="btn btn-secondary" id="woNext">→ Next</button>
        </div>

        <div id="woResult" class="result-message" style="margin:12px 0;"></div>

        <div class="game-stat" style="display:inline-block;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 24px;">
          <div class="game-stat-label" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-text-muted);">Score</div>
          <div class="game-stat-value" style="font-size:28px;font-weight:800;color:var(--color-primary);" id="woScore">0</div>
        </div>
      </div>

      <div class="feedback-area" style="border-top:1px solid var(--color-border);">
        <div class="tip"><span class="tip-icon" aria-hidden="true">💡</span><span>Click words to move them to the sentence area. Click them again to move them back. Match the pattern shown!</span></div>
      </div>
    </main>
  </div>
  <script>window.PAGE_TENSE = "Hub";</script>
</body>
</html>
