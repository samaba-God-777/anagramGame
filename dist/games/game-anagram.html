<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Anagram Game - Unscramble letters to form words. Multiple categories and difficulty levels." />
  <meta name="theme-color" content="#3b82f6" />
  <title>Anagram Game — English Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .anagram-word { font-size: 42px; font-weight: 800; letter-spacing: 12px; color: var(--color-primary); margin: 30px 0; font-family: 'SF Mono', monospace; text-transform: uppercase; }
    .game-controls-row { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .game-controls-row select { padding: 8px 14px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font-family: var(--font); font-size: 14px; }
    .game-input { padding: 12px 20px; font-size: 18px; border: 2px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); text-align: center; font-family: var(--font); width: 250px; max-width: 100%; }
    .game-input:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--shadow-glow); }
    .game-stats { display: flex; gap: 20px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
    .game-stat { background: var(--color-bg-secondary); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px 20px; transition: transform var(--transition), box-shadow var(--transition); }
    .game-stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .game-stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--color-text-muted); letter-spacing: 0.5px; }
    .game-stat-value { font-size: 24px; font-weight: 800; color: var(--color-primary); }
    @media (max-width: 640px) {
      .anagram-word { font-size: 28px; letter-spacing: 8px; }
    }
  </style>
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="/assets/main-CPFFK3fA.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/style-BObCwZKL.css">
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">🔤</span>
          <div>
            <h1 class="game-title">Anagram Game</h1>
            <p class="game-subtitle">Unscramble the letters to form words</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
        </div>
      </header>

      <div class="game-layout">
        <div class="game-controls-row">
          <select id="anagramLevel">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate" selected>Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
          <select id="anagramCategory"></select>
        </div>

        <div class="anagram-word" id="anagramWord">CAT</div>

        <div>
          <input type="text" class="game-input" id="anagramGuess" placeholder="Type your answer..." autocomplete="off" spellcheck="false" />
        </div>

        <div class="button-group" style="padding-top:20px;">
          <button class="btn btn-primary" id="anagramCheck">✓ Check</button>
          <button class="btn btn-accent" id="anagramHint">💡 Hint</button>
          <button class="btn btn-secondary" id="anagramNext">→ Next</button>
        </div>

        <div id="anagramResult" class="result-message" style="margin:16px 0;"></div>

        <div class="game-hint-area" style="min-height:30px;">
          <p id="anagramHintArea" style="font-size:20px;font-weight:700;letter-spacing:6px;color:var(--color-text-muted);font-family:'SF Mono',monospace;" hidden></p>
        </div>

        <div class="game-stats">
          <div class="game-stat">
            <div class="game-stat-label">Score</div>
            <div class="game-stat-value" id="anagramScore">0</div>
          </div>
          <div class="game-stat">
            <div class="game-stat-label">Timer</div>
            <div class="game-stat-value" id="anagramTimer">0s</div>
          </div>
        </div>
      </div>

      <div class="feedback-area" style="border-top:1px solid var(--color-border);">
        <div class="tip"><span class="tip-icon" aria-hidden="true">💡</span><span>Unscramble the letters. Type the word and press Check. Points are based on speed!</span></div>
      </div>
    </main>
  </div>
  <script>window.PAGE_TENSE = "Hub";</script>
</body>
</html>
