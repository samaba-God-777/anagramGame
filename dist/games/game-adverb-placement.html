<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Adverb Placement Game - Choose the correct position for adverbs in English sentences." />
  <meta name="theme-color" content="#06b6d4" />
  <title>Adverb Placement Game — English Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .ap-question { font-size: 20px; font-weight: 600; color: var(--color-text); margin: 24px 0; padding: 20px; background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius-lg); line-height: 1.7; }
    .ap-options { display: grid; grid-template-columns: 1fr; gap: 10px; max-width: 450px; margin: 0 auto; }
    .ap-option { padding: 14px !important; font-size: 15px !important; justify-content: center; }
    .ap-option.correct-answer { background: var(--color-success) !important; color: #fff !important; border-color: var(--color-success) !important; }
    .ap-option.wrong-answer { background: var(--color-error) !important; color: #fff !important; border-color: var(--color-error) !important; }
    .ap-option.show-correct { background: var(--color-success) !important; color: #fff !important; border-color: var(--color-success) !important; opacity: 0.7; }
    @media (max-width: 640px) { .ap-question { font-size: 17px; } }
  </style>
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="/assets/main-CPFFK3fA.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/style-BObCwZKL.css">
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">📍</span>
          <div>
            <h1 class="game-title">Adverb Placement</h1>
            <p class="game-subtitle">Choose the correct position for the adverb</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
          <a href="../grammar/adverb-positions.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">📖 Theory</a>
        </div>
      </header>

      <div class="game-layout">
        <div class="ap-question" id="apQuestion">Place the adverb <strong>"always"</strong> correctly:<br><span style="font-size:18px;color:var(--color-text-secondary);">She ______ arrives on time.</span></div>

        <div class="ap-options" id="apOptions"></div>

        <div class="button-group" style="padding-top:20px;">
          <button class="btn btn-secondary" id="apNext">→ Next</button>
        </div>

        <div id="apResult" class="result-message" style="margin:16px 0;"></div>

        <div class="game-stat" style="display:inline-block;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 24px;margin-top:12px;">
          <div class="game-stat-label" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-text-muted);">Score</div>
          <div class="game-stat-value" style="font-size:28px;font-weight:800;color:var(--color-primary);" id="apScore">0</div>
        </div>
      </div>

      <div class="feedback-area" style="border-top:1px solid var(--color-border);">
        <div class="tip"><span class="tip-icon" aria-hidden="true">💡</span><span>Select where the adverb should go: Front (before subject), Mid (after subject/auxiliary), or End (after verb/object).</span></div>
      </div>
    </main>
  </div>
  <script>window.PAGE_TENSE = "Hub";</script>
</body>
</html>
