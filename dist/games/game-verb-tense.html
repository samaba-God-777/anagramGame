<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Verb Tense Challenge - Master all 12 English tenses with CEFR-leveled exercises (A1-C2)." />
  <meta name="theme-color" content="#8b5cf6" />
  <title>Verb Tense Challenge — English Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .game-layout { max-width: 780px; }
    .vt-question { font-size: 22px; font-weight: 700; color: var(--color-text); margin: 20px 0; padding: 24px; background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius-lg); line-height: 1.5; }
    .vt-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; margin: 0 auto; }
    .vt-option { padding: 14px !important; font-size: 15px !important; justify-content: center; }
    .vt-option.correct-answer { background: var(--color-success) !important; color: #fff !important; border-color: var(--color-success) !important; }
    .vt-option.wrong-answer { background: var(--color-error) !important; color: #fff !important; border-color: var(--color-error) !important; }
    .vt-option.show-correct { background: var(--color-success) !important; color: #fff !important; border-color: var(--color-success) !important; }
    .vt-input-group { display: flex; gap: 8px; max-width: 500px; margin: 0 auto; }
    .vt-input { flex: 1; padding: 12px 16px; font-size: 16px; font-family: var(--font); border: 2px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); }
    .vt-input:focus { outline: none; border-color: var(--color-primary); }
    .vt-hint { font-size: 13px; color: var(--color-text-muted); margin-top: 8px; text-align: center; }
    .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
    .level-card { border-radius: var(--radius-lg); border: 1.5px solid var(--color-border); background: var(--color-surface); padding: 20px 14px; cursor: pointer; text-align: center; transition: all 0.3s var(--transition); position: relative; }
    .level-card:hover { transform: translateY(-4px); border-color: var(--color-primary); box-shadow: 0 12px 30px rgba(139,92,246,0.15); }
    .level-card .lv-emoji { font-size: 28px; margin-bottom: 6px; }
    .level-card .lv-code { font-size: 18px; font-weight: 800; }
    .level-card .lv-name { font-size: 11px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .level-card .lv-desc { font-size: 11px; color: var(--color-text-muted); margin-top: 4px; }
    .level-card .lv-tenses { font-size: 10px; color: var(--color-text-muted); margin-top: 6px; line-height: 1.4; }
    .level-card.done::after { content: "✅"; position: absolute; top: 8px; right: 8px; font-size: 14px; }
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text-muted); font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 20px; transition: all 0.2s; }
    .back-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .progress-ring { width: 130px; height: 130px; position: relative; margin: 0 auto; }
    .progress-ring svg { transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--color-border); stroke-width: 10; }
    .ring-fill { fill: none; stroke: var(--color-primary); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s var(--transition); }
    .ring-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring-num { font-size: 32px; font-weight: 800; color: var(--color-text); line-height: 1; }
    .ring-lbl { font-size: 11px; color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
    .rs { padding: 18px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--color-border); background: var(--color-surface); text-align: center; }
    .rs-val { font-size: 26px; font-weight: 800; color: var(--color-primary); }
    .rs-lbl { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
    .res-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .exercise-type { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .type-identify { background: rgba(139,92,246,0.15); color: #8b5cf6; }
    .type-complete { background: rgba(74,222,128,0.15); color: #4ade80; }
    .type-transform { background: rgba(251,146,60,0.15); color: #fb923c; }
    .transform-box { max-width: 500px; margin: 0 auto; }
    .transform-original { font-size: 16px; font-weight: 600; color: var(--color-text); margin-bottom: 12px; padding: 12px 16px; background: var(--color-bg-secondary); border-radius: var(--radius-md); }
    .transform-label { font-size: 12px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; margin-bottom: 8px; }
    @media (max-width: 640px) { .vt-question { font-size: 17px; } .vt-options { grid-template-columns: 1fr; } .level-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>

</head>
<body>
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">⏰</span>
          <div>
            <h1 class="game-title">Verb Tense Challenge</h1>
            <p class="game-subtitle" id="gameSubtitle">Master all 12 English tenses</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
          <a href="../grammar/verb-tenses.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">📖 Theory</a>
        </div>
      </header>

      <!-- LEVEL SELECT -->
      <div class="screen active" id="screenLevels">
        <div class="game-layout" style="margin:0 auto;">
          <h2 style="font-size:22px;font-weight:800;color:var(--color-text);margin-bottom:4px;">Choose Your Level</h2>
          <p style="font-size:14px;color:var(--color-text-muted);margin-bottom:20px;">10 exercises per level · Identify, Complete & Transform</p>
          <div class="level-grid" id="levelGrid"></div>
        </div>
      </div>

      <!-- GAME SCREEN -->
      <div class="screen" id="screenGame">
        <div class="game-layout" style="margin:0 auto;">
          <button class="back-btn" id="backBtn">← Levels</button>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
            <span id="levelBadge" style="display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:800;">A1</span>
            <span id="qCounter" style="font-size:13px;font-weight:600;color:var(--color-text-muted);">1 / 10</span>
            <span style="flex:1"></span>
            <span style="font-size:13px;font-weight:700;color:var(--color-text);">⭐ <span id="scoreDisp">0</span></span>
          </div>

          <div id="exerciseArea"></div>

          <div class="button-group" style="padding-top:16px;">
            <button class="btn btn-primary" id="checkBtn">✓ Check</button>
            <button class="btn btn-secondary" id="nextBtn">→ Next</button>
          </div>

          <div id="resultMsg" class="result-message" style="margin:14px 0;"></div>
        </div>
      </div>

      <!-- RESULTS SCREEN -->
      <div class="screen" id="screenResults">
        <div class="game-layout" style="margin:0 auto;text-align:center;">
          <div style="font-size:64px;margin-bottom:12px;" id="resTrophy">🏆</div>
          <div id="resLevelBadge" style="display:inline-block;padding:6px 18px;border-radius:999px;font-size:13px;font-weight:800;margin-bottom:12px;">A1 Complete</div>
          <h2 style="font-size:30px;font-weight:800;color:var(--color-text);margin-bottom:20px;" id="resTitle">Well done!</h2>
          <div class="progress-ring">
            <svg viewBox="0 0 130 130" width="130" height="130">
              <circle class="ring-bg" cx="65" cy="65" r="55"/>
              <circle class="ring-fill" id="ringFill" cx="65" cy="65" r="55" stroke-dasharray="345" stroke-dashoffset="345"/>
            </svg>
            <div class="ring-mid">
              <div class="ring-num" id="ringNum">0/10</div>
              <div class="ring-lbl">Correct</div>
            </div>
          </div>
          <div class="res-stats" style="margin-top:20px;">
            <div class="rs"><div class="rs-val" id="resAcc">0%</div><div class="rs-lbl">Accuracy</div></div>
            <div class="rs"><div class="rs-val" id="resXP">+0</div><div class="rs-lbl">XP Earned</div></div>
            <div class="rs"><div class="rs-val" id="resStreak">0</div><div class="rs-lbl">Best Streak</div></div>
          </div>
          <div class="res-btns" style="margin-top:24px;">
            <button class="btn btn-primary" id="btnRetry">Try Again</button>
            <button class="btn btn-secondary" id="btnNextLv">Next Level →</button>
            <button class="btn btn-secondary" id="btnBackLevels">All Levels</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
  /* ═══════════════════════════════════════════════════
     VERB TENSE CHALLENGE — CEFR A1–C2
     12 tenses × 3 forms (affirmative, negative, questions)
     ═══════════════════════════════════════════════════ */

  const LEVELS = {
    A1: { label: 'Beginner', emoji: '🌱', color: '#4ade80', tenses: ['Present Simple', 'Past Simple', 'Future Simple'], desc: 'Basic tenses: present, past, future simple' },
    A2: { label: 'Elementary', emoji: '📘', color: '#22d3ee', tenses: ['Present Continuous', 'Past Continuous'], desc: 'Continuous forms for ongoing actions' },
    B1: { label: 'Intermediate', emoji: '🔶', color: '#818cf8', tenses: ['Present Perfect', 'Present Perfect Continuous'], desc: 'Perfect forms connecting past to present' },
    B2: { label: 'Upper-Intermediate', emoji: '🔥', color: '#fb923c', tenses: ['Past Perfect', 'Past Perfect Continuous'], desc: 'Past of the past — sequencing events' },
    C1: { label: 'Advanced', emoji: '💎', color: '#f472b6', tenses: ['Future Continuous', 'Future Perfect'], desc: 'Future forms for planned & completed actions' },
    C2: { label: 'Mastery', emoji: '👑', color: '#a78bfa', tenses: ['Future Perfect Continuous', 'Mixed Review'], desc: 'Full mastery + mixed tense review' },
  };

  const EXERCISES = {
    A1: [
      // Present Simple — Identify
      { type: 'identify', tense: 'Present Simple', sentence: 'She works in a hospital.', options: ['Present Simple', 'Present Continuous', 'Past Simple', 'Future Simple'], hint: 'Habitual action with -s ending' },
      // Present Simple — Complete (affirmative)
      { type: 'complete', tense: 'Present Simple', sentence: 'I ___ tennis every Sunday.', answer: 'play', options: ['play', 'plays', 'playing', 'played'], hint: 'Base form for I/you/we/they' },
      // Present Simple — Transform (affirmative → negative)
      { type: 'transform', tense: 'Present Simple', original: 'He speaks English fluently.', targetForm: 'negative', answer: 'He does not speak English fluently.', options: ['He does not speak English fluently.', 'He does not speaks English fluently.', 'He not speak English fluently.', "He doesn't speaks English fluently."], hint: "Use does not + base verb" },
      // Past Simple — Identify
      { type: 'identify', tense: 'Past Simple', sentence: 'They went to the beach yesterday.', options: ['Past Simple', 'Past Continuous', 'Present Perfect', 'Present Simple'], hint: 'Completed action with past time marker' },
      // Past Simple — Complete (affirmative)
      { type: 'complete', tense: 'Past Simple', sentence: 'She ___ a new dress last week.', answer: 'bought', options: ['bought', 'buy', 'buys', 'buying'], hint: 'Irregular past form of buy' },
      // Past Simple — Transform (affirmative → question)
      { type: 'transform', tense: 'Past Simple', original: 'You saw the accident.', targetForm: 'question', answer: 'Did you see the accident?', options: ['Did you see the accident?', 'Do you see the accident?', 'Did you saw the accident?', 'Was you see the accident?'], hint: 'Use Did + subject + base verb' },
      // Future Simple — Identify
      { type: 'identify', tense: 'Future Simple', sentence: 'I will call you tomorrow.', options: ['Future Simple', 'Future Continuous', 'Present Simple', 'Present Perfect'], hint: 'will + base verb for future' },
      // Future Simple — Complete (affirmative)
      { type: 'complete', tense: 'Future Simple', sentence: 'She ___ arrive next week.', answer: 'will', options: ['will', 'is', 'has', 'was'], hint: 'will + base verb' },
      // Future Simple — Transform (affirmative → negative)
      { type: 'transform', tense: 'Future Simple', original: 'They will help us.', targetForm: 'negative', answer: 'They will not help us.', options: ['They will not help us.', 'They will not helps us.', 'They do not help us.', 'They are not help us.'], hint: 'will not + base verb (won't)' },
      // Mixed — Complete
      { type: 'complete', tense: 'Present Simple', sentence: 'The train ___ at 6 PM.', answer: 'leaves', options: ['leaves', 'leave', 'leaving', 'left'], hint: 'Timetables use Present Simple' },
    ],
    A2: [
      // Present Continuous — Identify
      { type: 'identify', tense: 'Present Continuous', sentence: 'She is cooking dinner right now.', options: ['Present Continuous', 'Present Simple', 'Past Continuous', 'Present Perfect'], hint: 'am/is/are + verb-ing' },
      // Present Continuous — Complete
      { type: 'complete', tense: 'Present Continuous', sentence: 'I ___ reading a book at the moment.', answer: 'am', options: ['am', 'is', 'are', 'was'], hint: 'am with I' },
      // Present Continuous — Transform (→ negative)
      { type: 'transform', tense: 'Present Continuous', original: 'They are playing soccer.', targetForm: 'negative', answer: 'They are not playing soccer.', options: ['They are not playing soccer.', 'They do not playing soccer.', 'They are not play soccer.', 'They not playing soccer.'], hint: 'are not + verb-ing' },
      // Past Continuous — Identify
      { type: 'identify', tense: 'Past Continuous', sentence: 'I was watching TV at 8 PM.', options: ['Past Continuous', 'Past Simple', 'Present Continuous', 'Past Perfect'], hint: 'was/were + verb-ing' },
      // Past Continuous — Complete
      { type: 'complete', tense: 'Past Continuous', sentence: 'She ___ cooking when I arrived.', answer: 'was', options: ['was', 'were', 'is', 'had'], hint: 'was with she/he/it' },
      // Past Continuous — Transform (→ question)
      { type: 'transform', tense: 'Past Continuous', original: 'He was studying for the test.', targetForm: 'question', answer: 'Was he studying for the test?', options: ['Was he studying for the test?', 'Did he was studying?', 'Is he studying for the test?', 'Were he studying for the test?'], hint: 'Was/Were + subject + verb-ing?' },
      // Present Continuous — Complete
      { type: 'complete', tense: 'Present Continuous', sentence: 'Look! It ___ outside.', answer: 'is raining', options: ['is raining', 'rains', 'rained', 'will rain'], hint: 'Action happening now' },
      // Past Continuous — Identify
      { type: 'identify', tense: 'Past Continuous', sentence: 'We were driving home when it started to rain.', options: ['Past Continuous', 'Past Simple', 'Past Perfect', 'Present Continuous'], hint: 'Ongoing past action interrupted' },
      // Present Continuous — Transform (→ question)
      { type: 'transform', tense: 'Present Continuous', original: 'She is working on the project.', targetForm: 'question', answer: 'Is she working on the project?', options: ['Is she working on the project?', 'Does she working on the project?', 'Is she works on the project?', 'Are she working on the project?'], hint: 'Is/Are + subject + verb-ing?' },
      // Mixed — Complete
      { type: 'complete', tense: 'Past Continuous', sentence: 'While I ___, the phone rang.', answer: 'was reading', options: ['was reading', 'read', 'am reading', 'have read'], hint: 'Background action in past' },
    ],
    B1: [
      // Present Perfect — Identify
      { type: 'identify', tense: 'Present Perfect', sentence: 'She has visited Paris three times.', options: ['Present Perfect', 'Present Simple', 'Past Simple', 'Present Perfect Continuous'], hint: 'have/has + past participle' },
      // Present Perfect — Complete
      { type: 'complete', tense: 'Present Perfect', sentence: 'I ___ finished my homework already.', answer: 'have', options: ['have', 'has', 'had', 'am'], hint: 'have with I/you/we/they' },
      // Present Perfect — Transform (→ negative)
      { type: 'transform', tense: 'Present Perfect', original: 'He has bought a new car.', targetForm: 'negative', answer: 'He has not bought a new car.', options: ['He has not bought a new car.', 'He have not bought a new car.', 'He does not bought a new car.', 'He has not buy a new car.'], hint: 'has not + past participle' },
      // Present Perfect Continuous — Identify
      { type: 'identify', tense: 'Present Perfect Continuous', sentence: 'I have been waiting for an hour.', options: ['Present Perfect Continuous', 'Present Perfect', 'Past Perfect Continuous', 'Present Continuous'], hint: 'have/has + been + verb-ing' },
      // Present Perfect Continuous — Complete
      { type: 'complete', tense: 'Present Perfect Continuous', sentence: 'She ___ studying all morning.', answer: 'has been', options: ['has been', 'have been', 'is being', 'was being'], hint: 'has been + verb-ing' },
      // Present Perfect — Transform (→ question)
      { type: 'transform', tense: 'Present Perfect', original: 'They have arrived at the airport.', targetForm: 'question', answer: 'Have they arrived at the airport?', options: ['Have they arrived at the airport?', 'Has they arrived at the airport?', 'Do they have arrived?', 'Are they arrived at the airport?'], hint: 'Have/Has + subject + past participle?' },
      // Present Perfect — Complete
      { type: 'complete', tense: 'Present Perfect', sentence: 'We ___ seen that movie before.', answer: 'have', options: ['have', 'has', 'had', 'did'], hint: 'have with we' },
      // Present Perfect Continuous — Transform (→ negative)
      { type: 'transform', tense: 'Present Perfect Continuous', original: 'They have been working since 8 AM.', targetForm: 'negative', answer: 'They have not been working since 8 AM.', options: ['They have not been working since 8 AM.', 'They has not been working since 8 AM.', 'They are not been working since 8 AM.', 'They have not been worked since 8 AM.'], hint: 'have not been + verb-ing' },
      // Present Perfect Continuous — Identify
      { type: 'identify', tense: 'Present Perfect Continuous', sentence: 'He has been living here for five years.', options: ['Present Perfect Continuous', 'Present Perfect', 'Past Perfect', 'Past Continuous'], hint: 'Duration with for/since' },
      // Mixed — Complete
      { type: 'complete', tense: 'Present Perfect', sentence: '___ you ever been to London?', answer: 'Have', options: ['Have', 'Has', 'Did', 'Are'], hint: 'Question with experience' },
    ],
    B2: [
      // Past Perfect — Identify
      { type: 'identify', tense: 'Past Perfect', sentence: 'I had already eaten when she arrived.', options: ['Past Perfect', 'Past Simple', 'Past Perfect Continuous', 'Present Perfect'], hint: 'had + past participle' },
      // Past Perfect — Complete
      { type: 'complete', tense: 'Past Perfect', sentence: 'She ___ finished her work before noon.', answer: 'had', options: ['had', 'has', 'have', 'was'], hint: 'had for all subjects' },
      // Past Perfect — Transform (→ negative)
      { type: 'transform', tense: 'Past Perfect', original: 'They had left before I called.', targetForm: 'negative', answer: 'They had not left before I called.', options: ['They had not left before I called.', 'They did not had left.', 'They have not left before I called.', 'They had not leave before I called.'], hint: 'had not + past participle' },
      // Past Perfect Continuous — Identify
      { type: 'identify', tense: 'Past Perfect Continuous', sentence: 'I had been waiting for two hours when she arrived.', options: ['Past Perfect Continuous', 'Past Perfect', 'Past Continuous', 'Present Perfect Continuous'], hint: 'had + been + verb-ing' },
      // Past Perfect Continuous — Complete
      { type: 'complete', tense: 'Past Perfect Continuous', sentence: 'She ___ studying for months before the exam.', answer: 'had been', options: ['had been', 'has been', 'was being', 'have been'], hint: 'had been + verb-ing' },
      // Past Perfect — Transform (→ question)
      { type: 'transform', tense: 'Past Perfect', original: 'He had never seen snow before.', targetForm: 'question', answer: 'Had he never seen snow before?', options: ['Had he never seen snow before?', 'Did he had seen snow before?', 'Has he never seen snow before?', 'Had he never saw snow before?'], hint: 'Had + subject + past participle?' },
      // Past Perfect — Complete
      { type: 'complete', tense: 'Past Perfect', sentence: 'We ___ booked the tickets in advance.', answer: 'had', options: ['had', 'have', 'has', 'did'], hint: 'had + past participle' },
      // Past Perfect Continuous — Transform (→ negative)
      { type: 'transform', tense: 'Past Perfect Continuous', original: 'He had been working all day.', targetForm: 'negative', answer: 'He had not been working all day.', options: ['He had not been working all day.', 'He has not been working all day.', 'He did not been working all day.', 'He had not been worked all day.'], hint: 'had not been + verb-ing' },
      // Past Perfect — Identify
      { type: 'identify', tense: 'Past Simple', sentence: 'They went to the store yesterday.', options: ['Past Simple', 'Past Perfect', 'Past Continuous', 'Present Simple'], hint: 'Completed past action' },
      // Mixed — Complete
      { type: 'complete', tense: 'Past Perfect', sentence: 'By the time we arrived, the movie ___ already started.', answer: 'had', options: ['had', 'has', 'have', 'was'], hint: 'Sequence of past events' },
    ],
    C1: [
      // Future Continuous — Identify
      { type: 'identify', tense: 'Future Continuous', sentence: 'I will be waiting for you at the airport.', options: ['Future Continuous', 'Future Simple', 'Future Perfect', 'Present Continuous'], hint: 'will be + verb-ing' },
      // Future Continuous — Complete
      { type: 'complete', tense: 'Future Continuous', sentence: 'She ___ working at 5 PM tomorrow.', answer: 'will be', options: ['will be', 'will', 'is being', 'has been'], hint: 'will be + verb-ing' },
      // Future Continuous — Transform (→ negative)
      { type: 'transform', tense: 'Future Continuous', original: 'They will be traveling across Europe.', targetForm: 'negative', answer: 'They will not be traveling across Europe.', options: ['They will not be traveling across Europe.', 'They will not traveling across Europe.', 'They are not be traveling across Europe.', 'They will not be traveled across Europe.'], hint: 'will not be + verb-ing' },
      // Future Perfect — Identify
      { type: 'identify', tense: 'Future Perfect', sentence: 'I will have finished the report by Friday.', options: ['Future Perfect', 'Future Simple', 'Future Continuous', 'Present Perfect'], hint: 'will have + past participle' },
      // Future Perfect — Complete
      { type: 'complete', tense: 'Future Perfect', sentence: 'She ___ graduated by next year.', answer: 'will have', options: ['will have', 'will', 'has', 'is going to have'], hint: 'will have + past participle' },
      // Future Perfect — Transform (→ question)
      { type: 'transform', tense: 'Future Perfect', original: 'They will have completed the work by Friday.', targetForm: 'question', answer: 'Will they have completed the work by Friday?', options: ['Will they have completed the work by Friday?', 'Have they will completed the work by Friday?', 'Will they has completed the work by Friday?', 'Are they going to have completed the work by Friday?'], hint: 'Will + subject + have + past participle?' },
      // Future Continuous — Complete
      { type: 'complete', tense: 'Future Continuous', sentence: '___ you be joining us for dinner?', answer: 'Will', options: ['Will', 'Are', 'Do', 'Have'], hint: 'Will + subject + be + verb-ing?' },
      // Future Perfect — Transform (→ negative)
      { type: 'transform', tense: 'Future Perfect', original: 'He will have saved enough money.', targetForm: 'negative', answer: 'He will not have saved enough money.', options: ['He will not have saved enough money.', 'He will not has saved enough money.', "He won't have save enough money.", 'He is not going to have saved enough money.'], hint: 'will not have + past participle' },
      // Future Continuous — Identify
      { type: 'identify', tense: 'Future Simple', sentence: 'The sun will rise at 6 AM tomorrow.', options: ['Future Simple', 'Future Continuous', 'Present Simple', 'Future Perfect'], hint: 'Simple future fact' },
      // Mixed — Complete
      { type: 'complete', tense: 'Future Perfect', sentence: 'By December, he ___ saved enough money.', answer: 'will have', options: ['will have', 'will be', 'has', 'had'], hint: 'Action completed before future time' },
    ],
    C2: [
      // Future Perfect Continuous — Identify
      { type: 'identify', tense: 'Future Perfect Continuous', sentence: 'I will have been working here for ten years next month.', options: ['Future Perfect Continuous', 'Future Perfect', 'Future Continuous', 'Present Perfect Continuous'], hint: 'will have been + verb-ing' },
      // Future Perfect Continuous — Complete
      { type: 'complete', tense: 'Future Perfect Continuous', sentence: 'She ___ studying for three hours by the time we arrive.', answer: 'will have been', options: ['will have been', 'will be', 'has been', 'will has been'], hint: 'will have been + verb-ing' },
      // Future Perfect Continuous — Transform (→ negative)
      { type: 'transform', tense: 'Future Perfect Continuous', original: 'They will have been traveling for 24 hours.', targetForm: 'negative', answer: 'They will not have been traveling for 24 hours.', options: ['They will not have been traveling for 24 hours.', 'They will not have been traveled for 24 hours.', 'They will not has been traveling for 24 hours.', 'They are not have been traveling for 24 hours.'], hint: 'will not have been + verb-ing' },
      // Mixed Review — Identify
      { type: 'identify', tense: 'Past Perfect Continuous', sentence: 'She had been studying for months before the exam.', options: ['Past Perfect Continuous', 'Past Perfect', 'Present Perfect Continuous', 'Past Continuous'], hint: 'had been + verb-ing' },
      // Mixed Review — Complete
      { type: 'complete', tense: 'Present Perfect Continuous', sentence: 'I ___ waiting for an hour.', answer: 'have been', options: ['have been', 'has been', 'am being', 'had been'], hint: 'have been + verb-ing' },
      // Mixed Review — Transform (→ question)
      { type: 'transform', tense: 'Future Continuous', original: 'He will be working tomorrow afternoon.', targetForm: 'question', answer: 'Will he be working tomorrow afternoon?', options: ['Will he be working tomorrow afternoon?', 'Is he will be working tomorrow afternoon?', 'Will he is working tomorrow afternoon?', 'Does he will be working tomorrow afternoon?'], hint: 'Will + subject + be + verb-ing?' },
      // Future Perfect Continuous — Complete
      { type: 'complete', tense: 'Future Perfect Continuous', sentence: 'We ___ building this house for six months by October.', answer: 'will have been', options: ['will have been', 'will be', 'have been', 'had been'], hint: 'will have been + verb-ing' },
      // Mixed Review — Transform (→ negative)
      { type: 'transform', tense: 'Past Perfect', original: 'She had finished her work.', targetForm: 'negative', answer: 'She had not finished her work.', options: ['She had not finished her work.', 'She did not had finished her work.', 'She has not finished her work.', 'She had not finish her work.'], hint: 'had not + past participle' },
      // Mixed Review — Identify
      { type: 'identify', tense: 'Present Perfect', sentence: 'We have seen that movie before.', options: ['Present Perfect', 'Past Simple', 'Present Perfect Continuous', 'Present Simple'], hint: 'have/has + past participle' },
      // Mixed Review — Complete
      { type: 'complete', tense: 'Past Continuous', sentence: 'I ___ watching TV when she called.', answer: 'was', options: ['was', 'were', 'am', 'had'], hint: 'was + verb-ing for I/he/she/it' },
    ],
  };

  const S = {
    lv: null, qi: 0, score: 0, correct: 0, streak: 0, bestStreak: 0,
    answered: false, questions: [],
    xp: JSON.parse(localStorage.getItem('vt_xp') || '{}'),
    done: JSON.parse(localStorage.getItem('vt_done') || '{}'),
  };

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ── LEVEL GRID ── */
  function buildLevels() {
    const g = document.getElementById('levelGrid');
    g.innerHTML = '';
    Object.keys(LEVELS).forEach(lv => {
      const d = LEVELS[lv];
      const done = !!S.done[lv];
      const el = document.createElement('div');
      el.className = 'level-card' + (done ? ' done' : '');
      el.innerHTML = `
        <div class="lv-emoji">${d.emoji}</div>
        <div class="lv-code" style="color:${d.color}">${lv}</div>
        <div class="lv-name">${d.label}</div>
        <div class="lv-desc">${d.desc}</div>
        <div class="lv-tenses">${d.tenses.join(' · ')}</div>
      `;
      el.addEventListener('click', () => startLevel(lv));
      g.appendChild(el);
    });
  }

  /* ── START LEVEL ── */
  function startLevel(lv) {
    S.lv = lv;
    S.qi = 0;
    S.score = 0;
    S.correct = 0;
    S.streak = 0;
    S.bestStreak = 0;
    S.questions = shuffle(EXERCISES[lv]);

    const d = LEVELS[lv];
    document.getElementById('gameSubtitle').textContent = `${d.emoji} ${lv} — ${d.label}`;
    document.getElementById('levelBadge').textContent = lv;
    document.getElementById('levelBadge').style.background = d.color + '22';
    document.getElementById('levelBadge').style.borderColor = d.color;
    document.getElementById('levelBadge').style.color = d.color;

    showScreen('screenGame');
    renderExercise();
  }

  /* ── RENDER EXERCISE ── */
  function renderExercise() {
    const ex = S.questions[S.qi];
    S.answered = false;

    document.getElementById('qCounter').textContent = `${S.qi + 1} / ${S.questions.length}`;
    document.getElementById('scoreDisp').textContent = S.score;
    document.getElementById('resultMsg').textContent = '';
    document.getElementById('resultMsg').className = 'result-message';
    document.getElementById('checkBtn').disabled = false;
    document.getElementById('checkBtn').style.display = '';
    document.getElementById('nextBtn').style.display = 'none';

    const area = document.getElementById('exerciseArea');
    area.innerHTML = '';

    // Exercise type badge
    const typeBadge = document.createElement('div');
    const typeMap = { identify: ['Identify the Tense', 'type-identify'], complete: ['Complete the Sentence', 'type-complete'], transform: ['Transform the Sentence', 'type-transform'] };
    typeBadge.className = 'exercise-type ' + typeMap[ex.type][1];
    typeBadge.textContent = typeMap[ex.type][0];
    area.appendChild(typeBadge);

    if (ex.type === 'identify') {
      renderIdentify(ex, area);
    } else if (ex.type === 'complete') {
      renderComplete(ex, area);
    } else if (ex.type === 'transform') {
      renderTransform(ex, area);
    }
  }

  function renderIdentify(ex, area) {
    const q = document.createElement('div');
    q.className = 'vt-question';
    q.textContent = `"${ex.sentence}"`;
    area.appendChild(q);

    const opts = document.createElement('div');
    opts.className = 'vt-options';
    opts.id = 'vtOptions';

    const shuffledOpts = shuffle(ex.options);
    shuffledOpts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-game vt-option';
      btn.textContent = opt;
      btn.dataset.answer = opt;
      btn.addEventListener('click', () => {
        if (S.answered) return;
        opts.querySelectorAll('.vt-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('checkBtn').disabled = false;
      });
      opts.appendChild(btn);
    });

    area.appendChild(opts);

    const hint = document.createElement('div');
    hint.className = 'vt-hint';
    hint.textContent = ex.hint;
    area.appendChild(hint);
  }

  function renderComplete(ex, area) {
    const q = document.createElement('div');
    q.className = 'vt-question';
    q.innerHTML = ex.sentence.replace('___', '<strong style="color:var(--color-primary);border-bottom:2px dashed var(--color-primary);padding:0 4px;">___</strong>');
    area.appendChild(q);

    const opts = document.createElement('div');
    opts.className = 'vt-options';
    opts.id = 'vtOptions';

    const shuffledOpts = shuffle(ex.options);
    shuffledOpts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-game vt-option';
      btn.textContent = opt;
      btn.dataset.answer = opt;
      btn.addEventListener('click', () => {
        if (S.answered) return;
        opts.querySelectorAll('.vt-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('checkBtn').disabled = false;
      });
      opts.appendChild(btn);
    });

    area.appendChild(opts);

    const hint = document.createElement('div');
    hint.className = 'vt-hint';
    hint.textContent = ex.hint;
    area.appendChild(hint);
  }

  function renderTransform(ex, area) {
    const box = document.createElement('div');
    box.className = 'transform-box';

    const origLabel = document.createElement('div');
    origLabel.className = 'transform-label';
    origLabel.textContent = 'Original sentence:';
    box.appendChild(origLabel);

    const orig = document.createElement('div');
    orig.className = 'transform-original';
    orig.textContent = ex.original;
    box.appendChild(orig);

    const targetLabel = document.createElement('div');
    targetLabel.className = 'transform-label';
    targetLabel.style.marginTop = '16px';
    const formMap = { negative: 'Write the NEGATIVE form:', question: 'Write the QUESTION form:' };
    targetLabel.textContent = formMap[ex.targetForm];
    box.appendChild(targetLabel);

    const opts = document.createElement('div');
    opts.className = 'vt-options';
    opts.id = 'vtOptions';
    opts.style.maxWidth = '100%';

    const shuffledOpts = shuffle(ex.options);
    shuffledOpts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-game vt-option';
      btn.style.justifyContent = 'flex-start';
      btn.textContent = opt;
      btn.dataset.answer = opt;
      btn.addEventListener('click', () => {
        if (S.answered) return;
        opts.querySelectorAll('.vt-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('checkBtn').disabled = false;
      });
      opts.appendChild(btn);
    });

    box.appendChild(opts);

    const hint = document.createElement('div');
    hint.className = 'vt-hint';
    hint.textContent = ex.hint;
    box.appendChild(hint);

    area.appendChild(box);
  }

  /* ── CHECK ANSWER ── */
  function checkAnswer() {
    if (S.answered) return;
    const ex = S.questions[S.qi];
    const selected = document.querySelector('#vtOptions .selected');
    if (!selected) return;

    S.answered = true;
    const userAnswer = selected.dataset.answer;
    const correct = userAnswer === ex.answer;

    document.querySelectorAll('#vtOptions .vt-option').forEach(btn => {
      btn.classList.add('disabled');
      if (btn.dataset.answer === ex.answer) btn.classList.add('correct-answer');
      else if (btn === selected && !correct) btn.classList.add('wrong-answer');
    });

    const resultEl = document.getElementById('resultMsg');
    if (correct) {
      S.correct++;
      S.score += 15;
      S.streak++;
      if (S.streak > S.bestStreak) S.bestStreak = S.streak;
      resultEl.textContent = `🎉 Correct! ${ex.hint}`;
      resultEl.className = 'result-message result-success';
    } else {
      S.streak = 0;
      resultEl.innerHTML = `❌ Not quite. Correct: <strong>${ex.answer}</strong><br><em>${ex.hint}</em>`;
      resultEl.className = 'result-message result-error';
    }

    document.getElementById('scoreDisp').textContent = S.score;
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = '';
    document.getElementById('nextBtn').textContent = S.qi + 1 < S.questions.length ? '→ Next' : 'See Results →';
  }

  /* ── NEXT / RESULTS ── */
  function nextQ() {
    S.qi++;
    if (S.qi >= S.questions.length) showResults();
    else renderExercise();
  }

  function showResults() {
    const total = S.questions.length;
    const acc = Math.round((S.correct / total) * 100);

    S.xp[S.lv] = (S.xp[S.lv] || 0) + S.score;
    if (acc >= 60) S.done[S.lv] = true;
    localStorage.setItem('vt_xp', JSON.stringify(S.xp));
    localStorage.setItem('vt_done', JSON.stringify(S.done));

    const trophies = [[100, '🏆'], [80, '🥇'], [60, '🥈'], [0, '🥉']];
    document.getElementById('resTrophy').textContent = trophies.find(([t]) => acc >= t)[1];
    const titles = [[100, 'Perfect Score!'], [80, 'Excellent!'], [60, 'Good Job!'], [0, 'Keep Practising!']];
    document.getElementById('resTitle').textContent = titles.find(([t]) => acc >= t)[1];

    const d = LEVELS[S.lv];
    const badge = document.getElementById('resLevelBadge');
    badge.textContent = `${S.lv} · ${d.label}`;
    badge.style.background = d.color + '22';
    badge.style.borderColor = d.color;
    badge.style.color = d.color;

    document.getElementById('ringNum').textContent = `${S.correct}/${total}`;
    const circ = 2 * Math.PI * 55;
    setTimeout(() => {
      const rf = document.getElementById('ringFill');
      rf.style.strokeDashoffset = circ * (1 - S.correct / total);
      rf.style.stroke = d.color;
    }, 150);

    document.getElementById('resAcc').textContent = acc + '%';
    document.getElementById('resAcc').style.color = d.color;
    document.getElementById('resXP').textContent = '+' + S.score;
    document.getElementById('resXP').style.color = d.color;
    document.getElementById('resStreak').textContent = S.bestStreak;
    document.getElementById('resStreak').style.color = d.color;

    const ni = Object.keys(LEVELS).indexOf(S.lv) + 1;
    const btnNL = document.getElementById('btnNextLv');
    if (ni < Object.keys(LEVELS).length) {
      const nextLv = Object.keys(LEVELS)[ni];
      btnNL.textContent = `Next: ${nextLv} →`;
      btnNL.style.display = '';
      btnNL.onclick = () => startLevel(nextLv);
    } else {
      btnNL.style.display = 'none';
    }

    showScreen('screenResults');
  }

  /* ── INIT ── */
  document.addEventListener('DOMContentLoaded', () => {
    buildLevels();

    document.getElementById('checkBtn').addEventListener('click', checkAnswer);
    document.getElementById('nextBtn').addEventListener('click', nextQ);
    document.getElementById('backBtn').addEventListener('click', () => {
      buildLevels();
      showScreen('screenLevels');
    });
    document.getElementById('btnRetry').addEventListener('click', () => startLevel(S.lv));
    document.getElementById('btnBackLevels').addEventListener('click', () => {
      buildLevels();
      showScreen('screenLevels');
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const activeScreen = document.querySelector('.screen.active');
        if (activeScreen?.id === 'screenGame') {
          if (document.getElementById('checkBtn').style.display !== 'none' && !document.getElementById('checkBtn').disabled) {
            checkAnswer();
          } else if (document.getElementById('nextBtn').style.display !== 'none') {
            nextQ();
          }
        }
      }
    });
  });
  </script>
</body>
</html>
