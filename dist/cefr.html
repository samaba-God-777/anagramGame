<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEFR Anagram — A1 to C1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* ── TOKENS ── */
:root {
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-full: 9999px;

  /* level accent colours */
  --a1:#4ade80; --a1b:rgba(74,222,128,.12);  --a1g:rgba(74,222,128,.4);
  --a2:#22d3ee; --a2b:rgba(34,211,238,.12);  --a2g:rgba(34,211,238,.4);
  --b1:#818cf8; --b1b:rgba(129,140,248,.12); --b1g:rgba(129,140,248,.4);
  --b2:#fb923c; --b2b:rgba(251,146,60,.12);  --b2g:rgba(251,146,60,.4);
  --c1:#f472b6; --c1b:rgba(244,114,182,.12); --c1g:rgba(244,114,182,.4);

  /* active level (changed by JS) */
  --lv:#4ade80; --lvb:rgba(74,222,128,.12); --lvg:rgba(74,222,128,.4);
}

[data-theme="dark"] {
  --bg:#080912; --bg2:#0e1220;
  --sur:rgba(255,255,255,.04); --sur2:rgba(255,255,255,.08);
  --bdr:rgba(255,255,255,.09); --bdr2:rgba(255,255,255,.18);
  --tx:#e8f0fe; --tx2:rgba(232,240,254,.55); --tx3:rgba(232,240,254,.28);
  --ok:#4ade80; --ok-b:rgba(74,222,128,.14);
  --er:#f87171; --er-b:rgba(248,113,113,.14);
}

[data-theme="light"] {
  --bg:#f1f5ff; --bg2:#e4eaf8;
  --sur:rgba(255,255,255,.85); --sur2:#fff;
  --bdr:rgba(0,0,0,.08); --bdr2:rgba(0,0,0,.18);
  --tx:#0d1b2a; --tx2:#4b5a72; --tx3:#9aa5bb;
  --ok:#16a34a; --ok-b:#dcfce7;
  --er:#dc2626; --er-b:#fee2e2;
}

/* ── RESET ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font);background:var(--bg);color:var(--tx);
  min-height:100vh;line-height:1.6;overflow-x:hidden;
  transition:background .4s var(--ease),color .4s var(--ease);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 15% -5%, var(--lvg) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 85% 105%, rgba(129,140,248,.12) 0%, transparent 55%);
  transition:all .8s var(--ease);z-index:0;
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ── HEADER ── */
.hdr{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  background:rgba(8,9,18,.75);border-bottom:1px solid var(--bdr);
}
[data-theme="light"] .hdr{background:rgba(241,245,255,.85)}
.hdr-inner{
  max-width:800px;margin:0 auto;height:60px;
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--lv) 0%,rgba(255,255,255,.15) 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;box-shadow:0 4px 12px var(--lvg);
  transition:all .4s var(--bounce);
}
.logo-name{font-size:15px;font-weight:800;color:var(--tx);white-space:nowrap}
.logo-name span{color:var(--lv);transition:color .4s}
.hdr-center{flex:1;display:flex;justify-content:center}
.q-counter{font-size:13px;font-weight:700;color:var(--tx2)}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.score-pill{
  display:flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:var(--r-full);
  background:var(--sur);border:1px solid var(--bdr);
  font-size:13px;font-weight:700;color:var(--tx);
}
.score-star{color:#fbbf24}
.icon-btn{
  width:36px;height:36px;border-radius:var(--r-full);
  border:1px solid var(--bdr);background:var(--sur);
  color:var(--tx2);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--ease);font-family:var(--font);
}
.icon-btn:hover{border-color:var(--bdr2);color:var(--tx);transform:scale(1.08)}
.xp-strip{height:3px;background:var(--bdr);overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--lv),rgba(255,255,255,.5));transition:width .5s var(--bounce);width:0%}

/* ── SCREENS ── */
.scr{display:none;flex:1;flex-direction:column}
.scr.on{display:flex;animation:screenIn .4s var(--bounce)}
@keyframes screenIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

/* ══════════════════════════════
   LANDING
══════════════════════════════ */
#s-land{padding:40px 20px 60px;align-items:center}
.land-inner{max-width:860px;width:100%}

.land-hero{text-align:center;margin-bottom:44px}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 16px;border-radius:var(--r-full);
  background:var(--lvb);border:1px solid rgba(255,255,255,.1);
  font-size:11px;font-weight:800;color:var(--lv);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:18px;
  transition:all .4s;
}
.land-title{
  font-size:clamp(30px,5vw,50px);font-weight:800;
  letter-spacing:-1.2px;line-height:1.1;margin-bottom:14px;color:var(--tx);
}
.land-title span{
  background:linear-gradient(135deg,var(--lv) 0%,rgba(255,255,255,.85) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;transition:all .4s;
}
.land-sub{font-size:16px;color:var(--tx2);max-width:480px;margin:0 auto}

.lv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}

.lv-card{
  border-radius:var(--r-lg);border:1.5px solid var(--bdr);
  background:var(--sur);backdrop-filter:blur(12px);
  padding:24px 18px;cursor:pointer;
  transition:all .35s var(--bounce);overflow:hidden;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;
  position:relative;
}
.lv-card::before{
  content:"";position:absolute;inset:0;opacity:0;
  background:var(--card-bg);transition:opacity .3s;border-radius:inherit;
}
.lv-card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--card-c);
  box-shadow:0 20px 50px rgba(0,0,0,.2),0 0 0 1px var(--card-c)}
.lv-card:hover::before{opacity:1}
.lv-card[data-lv="A1"]{--card-c:var(--a1);--card-bg:var(--a1b)}
.lv-card[data-lv="A2"]{--card-c:var(--a2);--card-bg:var(--a2b)}
.lv-card[data-lv="B1"]{--card-c:var(--b1);--card-bg:var(--b1b)}
.lv-card[data-lv="B2"]{--card-c:var(--b2);--card-bg:var(--b2b)}
.lv-card[data-lv="C1"]{--card-c:var(--c1);--card-bg:var(--c1b)}

.card-icon{
  position:relative;z-index:1;
  font-size:28px;width:58px;height:58px;border-radius:var(--r-md);
  background:var(--card-bg);border:1.5px solid var(--card-c);
  display:flex;align-items:center;justify-content:center;
  transition:all .35s var(--bounce);
}
.lv-card:hover .card-icon{transform:scale(1.12) rotate(-4deg);box-shadow:0 8px 20px var(--card-c)}
.card-lv{position:relative;z-index:1;font-size:20px;font-weight:800;color:var(--card-c);line-height:1}
.card-name{position:relative;z-index:1;font-size:12px;font-weight:700;color:var(--tx);text-transform:uppercase;letter-spacing:.8px}
.card-desc{position:relative;z-index:1;font-size:11.5px;color:var(--tx2);line-height:1.5}
.card-types{
  position:relative;z-index:1;width:100%;
  display:flex;gap:4px;justify-content:center;margin-top:2px;
}
.type-tag{
  padding:3px 9px;border-radius:var(--r-full);
  font-size:10px;font-weight:700;
  background:var(--sur2);border:1px solid var(--bdr);color:var(--tx2);
}
.card-xp{position:relative;z-index:1;font-size:11px;font-weight:700;color:var(--card-c)}
.card-done{position:absolute;top:10px;right:10px;z-index:2;font-size:16px}

/* ══════════════════════════════
   GAME SCREEN
══════════════════════════════ */
#s-game{padding:24px 20px 48px;align-items:center}
.game-wrap{max-width:640px;width:100%;display:flex;flex-direction:column;gap:18px}

/* level pill */
.lv-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;border-radius:var(--r-full);align-self:flex-start;
  background:var(--lvb);border:1px solid var(--lv);
  font-size:13px;font-weight:700;color:var(--lv);
}

/* dots */
.dots{display:flex;justify-content:center;gap:6px}
.dot{
  width:8px;height:8px;border-radius:var(--r-full);
  background:var(--bdr2);transition:all .3s var(--bounce);
}
.dot.cur{width:22px;background:var(--lv);box-shadow:0 0 8px var(--lvg)}
.dot.ok{background:var(--ok)}
.dot.er{background:var(--er)}

/* ── exercise card ── */
.ex-card{
  border-radius:var(--r-xl);border:1.5px solid var(--bdr);
  background:var(--sur);backdrop-filter:blur(20px);
  padding:36px 32px;display:flex;flex-direction:column;gap:24px;
  animation:cardIn .4s var(--bounce);position:relative;overflow:hidden;
}
[data-theme="light"] .ex-card{background:rgba(255,255,255,.92);box-shadow:0 8px 40px rgba(0,0,0,.07)}
@keyframes cardIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.ex-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--lv),transparent);
}

.ex-label{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:4px 12px;border-radius:var(--r-full);
  background:var(--lvb);font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.9px;color:var(--lv);
}

/* hint box */
.hint-box{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;border-radius:var(--r-md);
  background:var(--bg2);border:1px solid var(--bdr);
}
.hint-emoji{font-size:24px;flex-shrink:0}
.hint-text{font-size:14px;font-weight:600;color:var(--tx2);line-height:1.5}
.hint-grammar{
  margin-top:4px;font-size:12px;color:var(--tx3);
  font-style:italic;display:block;
}

/* ── ANSWER ZONE ── */
.zone-label{
  font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.8px;color:var(--tx3);
}
.answer-zone{
  min-height:56px;border-radius:var(--r-md);
  border:2px dashed var(--lv);background:var(--lvb);
  padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  transition:all .2s;
}
.answer-zone:empty::after{
  content:"Click tiles below to build your answer…";
  color:var(--tx3);font-size:13px;font-style:italic;
}

/* ── LETTER TILES (anagram) ── */
.tile{
  width:48px;height:52px;border-radius:var(--r-sm);
  border:2px solid var(--bdr2);background:var(--sur2);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;color:var(--tx);cursor:pointer;
  transition:all .2s var(--bounce);user-select:none;
  flex-shrink:0;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.3), 0 4px 8px rgba(0,0,0,.15);
  text-transform:uppercase;
}
.tile:hover{
  transform:translateY(-3px) scale(1.08);
  border-color:var(--lv);color:var(--lv);
  box-shadow:0 6px 0 rgba(0,0,0,.2),0 8px 16px var(--lvg);
}
.tile:active{transform:scale(.94);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.tile.placed{
  border-color:var(--lv);background:var(--lvb);color:var(--lv);
  box-shadow:0 2px 0 rgba(0,0,0,.15),0 0 8px var(--lvg);
}
.tile.placed:hover{
  border-color:var(--er);color:var(--er);background:var(--er-b);
  box-shadow:0 2px 8px var(--er-b);transform:translateY(-2px);
}
.tile.t-ok{border-color:var(--ok)!important;background:var(--ok-b)!important;color:var(--ok)!important;cursor:default!important;box-shadow:0 2px 8px var(--ok-b)!important}
.tile.t-er{border-color:var(--er)!important;background:var(--er-b)!important;color:var(--er)!important;cursor:default!important;animation:tileShake .4s ease}
@keyframes tileShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}

/* tile pool */
.tile-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}

/* ── WORD CHIPS (unscramble) ── */
.chip{
  padding:10px 20px;border-radius:var(--r-full);
  border:1.5px solid var(--bdr2);background:var(--sur2);
  color:var(--tx);font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s var(--bounce);
  user-select:none;font-family:var(--font);
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.chip:hover{
  border-color:var(--lv);background:var(--lvb);color:var(--lv);
  transform:translateY(-2px) scale(1.04);
  box-shadow:0 4px 12px var(--lvg);
}
.chip:active{transform:scale(.96)}
.chip.placed{border-color:var(--lv);background:var(--lvb);color:var(--lv)}
.chip.placed:hover{border-color:var(--er);background:var(--er-b);color:var(--er)}
.chip.c-ok{border-color:var(--ok)!important;background:var(--ok-b)!important;color:var(--ok)!important;cursor:default!important}
.chip.c-er{border-color:var(--er)!important;background:var(--er-b)!important;color:var(--er)!important;cursor:default!important}

.chip-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}

/* divider arrow */
.pool-sep{display:flex;justify-content:center;color:var(--tx3);font-size:20px;opacity:.6}

/* ── FEEDBACK ── */
.feedback{
  display:none;flex-direction:row;align-items:flex-start;gap:12px;
  padding:14px 18px;border-radius:var(--r-md);
  font-size:14px;font-weight:600;animation:feedIn .35s var(--bounce);
}
@keyframes feedIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feedback.ok{display:flex;background:var(--ok-b);color:var(--ok);border:1px solid rgba(74,222,128,.25)}
.feedback.er{display:flex;background:var(--er-b);color:var(--er);border:1px solid rgba(248,113,113,.25)}
.fb-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.fb-body{flex:1;line-height:1.6}
.fb-expl{display:block;font-weight:400;opacity:.8;margin-top:2px;font-size:13px}
.correct-answer{
  display:none;margin-top:8px;padding:10px 14px;
  border-radius:var(--r-sm);background:var(--ok-b);
  font-size:13px;font-weight:700;color:var(--ok);
}

/* ── ACTION ROW ── */
.actions{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
.btn{
  padding:11px 26px;border-radius:var(--r-full);
  font-size:14px;font-weight:700;border:none;cursor:pointer;
  font-family:var(--font);transition:all .25s var(--bounce);
  display:flex;align-items:center;gap:6px;
}
.btn-check{background:var(--lv);color:#080912;box-shadow:0 4px 14px var(--lvg)}
.btn-check:hover{filter:brightness(1.1);transform:translateY(-2px) scale(1.03);box-shadow:0 8px 22px var(--lvg)}
.btn-check:active{transform:scale(.96)}
.btn-check:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn-next{background:var(--lv);color:#080912;box-shadow:0 4px 14px var(--lvg);display:none}
.btn-next:hover{filter:brightness(1.1);transform:translateY(-2px) scale(1.03)}
.btn-next:active{transform:scale(.96)}
.btn-quit{background:var(--sur);color:var(--tx2);border:1.5px solid var(--bdr);box-shadow:none}
.btn-quit:hover{border-color:var(--bdr2);color:var(--tx)}

/* ══════════════════════════════
   RESULTS
══════════════════════════════ */
#s-res{padding:48px 20px;align-items:center;justify-content:center}
.res-wrap{max-width:480px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:28px}
.res-trophy{font-size:68px;animation:trophyIn .6s var(--bounce);filter:drop-shadow(0 6px 20px var(--lvg))}
@keyframes trophyIn{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.res-lv-badge{
  padding:7px 20px;border-radius:var(--r-full);
  background:var(--lvb);border:1.5px solid var(--lv);
  color:var(--lv);font-size:14px;font-weight:800;
}
.res-title{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--tx)}
.res-ring{width:130px;height:130px;position:relative}
.res-ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bdr2);stroke-width:10}
.ring-fill{fill:none;stroke:var(--lv);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-size:32px;font-weight:800;color:var(--tx);line-height:1}
.ring-lbl{font-size:11px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.rs{padding:18px 14px;border-radius:var(--r-md);border:1.5px solid var(--bdr);background:var(--sur)}
.rs-val{font-size:26px;font-weight:800;color:var(--lv)}
.rs-lbl{font-size:11px;color:var(--tx2);margin-top:2px}
.res-can-do{
  width:100%;padding:18px 22px;border-radius:var(--r-md);
  background:var(--lvb);border:1.5px solid var(--lv);text-align:left;
}
.res-can-do h4{font-size:11px;font-weight:800;color:var(--lv);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.res-can-do ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.res-can-do li{font-size:13px;color:var(--tx);padding-left:18px;position:relative}
.res-can-do li::before{content:"✓";position:absolute;left:0;color:var(--lv);font-weight:700}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-lg{
  padding:13px 30px;border-radius:var(--r-full);
  font-size:14px;font-weight:800;border:none;cursor:pointer;
  font-family:var(--font);transition:all .25s var(--bounce);
}
.btn-lg-primary{background:var(--lv);color:#080912;box-shadow:0 5px 18px var(--lvg)}
.btn-lg-primary:hover{filter:brightness(1.1);transform:translateY(-2px) scale(1.02)}
.btn-lg-sec{background:var(--sur);color:var(--tx);border:1.5px solid var(--bdr2)}
.btn-lg-sec:hover{border-color:var(--lv);color:var(--lv)}

/* ── CONFETTI ── */
.conf-piece{position:fixed;top:-20px;pointer-events:none;z-index:9999;animation:fall linear forwards;font-size:16px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ── RESPONSIVE ── */
@media(max-width:860px){.lv-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:580px){
  .lv-grid{grid-template-columns:1fr 1fr}
  .ex-card{padding:24px 18px}
  #s-land{padding:28px 16px 48px}
  .tile{width:42px;height:46px;font-size:18px}
}
@media(max-width:380px){.lv-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:6px}

<body>
<div id="app">

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-inner">
    <a class="logo" href="#" id="logoLink">
      <div class="logo-mark" id="logoMark">🔤</div>
      <span class="logo-name">CEFR <span id="logoSpan">Anagram</span></span>
    </a>
    <div class="hdr-center"><span class="q-counter" id="qCounter"></span></div>
    <div class="hdr-right">
      <div class="score-pill"><span class="score-star">⭐</span><span id="scoreDisp">0</span></div>
      <button class="icon-btn" id="themeBtn">☀️</button>
      <button class="icon-btn" id="homeBtn" title="Home">🏠</button>
    </div>
  </div>
  <div class="xp-strip"><div class="xp-fill" id="xpFill"></div></div>
</header>

<!-- LANDING -->
<section class="scr on" id="s-land">
  <div class="land-inner">
    <div class="land-hero">
      <div class="eyebrow" id="eyebrow">🇪🇺 Common European Framework of Reference</div>
      <h1 class="land-title">Anagram &amp; Unscramble <span id="landSpan">by CEFR Level</span></h1>
      <p class="land-sub">Unscramble letters to find words · Rearrange words to build sentences · Levelled A1–C1</p>
    </div>
    <div class="lv-grid" id="lvGrid"></div>
  </div>
</section>

<!-- GAME -->
<section class="scr" id="s-game">
  <div class="game-wrap">
    <div class="lv-pill" id="gamePill">🟢 A1 — Beginner</div>
    <div class="dots" id="dotsRow"></div>
    <div class="ex-card" id="exCard"><!-- rendered by JS --></div>
    <div class="actions">
      <button class="btn btn-quit" id="btnQuit">← Exit</button>
      <button class="btn btn-check" id="btnCheck" disabled>Check ✓</button>
      <button class="btn btn-next" id="btnNext">Next →</button>
    </div>
  </div>
</section>

<!-- RESULTS -->
<section class="scr" id="s-res">
  <div class="res-wrap">
    <div class="res-trophy" id="resTrophy">🏆</div>
    <div class="res-lv-badge" id="resLvBadge">A1 Complete</div>
    <h2 class="res-title" id="resTitle">Well done!</h2>
    <div class="res-ring">
      <svg viewBox="0 0 130 130" width="130" height="130">
        <circle class="ring-bg" cx="65" cy="65" r="55"/>
        <circle class="ring-fill" id="ringFill" cx="65" cy="65" r="55" stroke-dasharray="345" stroke-dashoffset="345"/>
      </svg>
      <div class="ring-mid">
        <div class="ring-num" id="ringNum">0/8</div>
        <div class="ring-lbl">Correct</div>
      </div>
    </div>
    <div class="res-stats">
      <div class="rs"><div class="rs-val" id="resAcc">0%</div><div class="rs-lbl">Accuracy</div></div>
      <div class="rs"><div class="rs-val" id="resXP">+0</div><div class="rs-lbl">XP Earned</div></div>
      <div class="rs"><div class="rs-val" id="resSt">0</div><div class="rs-lbl">Best Streak</div></div>
    </div>
    <div class="res-can-do" id="resCanDo">
      <h4>✅ You can now…</h4>
      <ul id="resCanDoList"></ul>
    </div>
    <div class="res-btns">
      <button class="btn-lg btn-lg-primary" id="btnRetry">Try Again</button>
      <button class="btn-lg btn-lg-sec" id="btnNextLv">Next Level →</button>
      <button class="btn-lg btn-lg-sec" id="btnHome2">Choose Level</button>
    </div>
  </div>
</section>

</div><!-- #app -->
</body>
</html>
