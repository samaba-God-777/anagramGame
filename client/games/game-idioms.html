<!DOCTYPE html>
<html lang="en" data-page="idioms-game">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Master idioms with interactive exercises and Wikipedia examples." />
  <meta name="theme-color" content="#7c3aed" />
  <title>Idioms Game — English Learning Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">🎭</span>
          <div>
            <h1 class="game-title">Idioms Game</h1>
            <p class="game-subtitle">Master idioms with real examples from Wikipedia</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
          </button>
        </div>
      </header>

      <div class="game-intro" id="gameIntro">
        <div class="game-intro-icon">🎭</div>
        <h2 class="game-intro-title">Idioms Challenge</h2>
        <p class="game-intro-desc">Test your knowledge of English idioms with 20 interactive questions. Each question includes real examples and explanations from Wikipedia.</p>
        <div class="game-intro-features">
          <div class="game-intro-feature">
            <span class="game-intro-feature-icon">🎯</span>
            <span class="game-intro-feature-text">20 Questions</span>
          </div>
          <div class="game-intro-feature">
            <span class="game-intro-feature-icon">📚</span>
            <span class="game-intro-feature-text">Wikipedia Context</span>
          </div>
          <div class="game-intro-feature">
            <span class="game-intro-feature-icon">🔥</span>
            <span class="game-intro-feature-text">Streak Bonus</span>
          </div>
        </div>
        <button class="btn-start-game" id="startGameBtn">🚀 Start Game</button>
      </div>

      <div id="gameContent" style="display:none;"></div>
      <div id="gameResults" style="display:none;"></div>
    </main>
  </div>
  <script type="module">
    import { initTheme } from '/src/lib/theme.js';
    import { buildGlobalSidebar } from '/src/lib/sidebar.js';
    import { initGame } from '/src/features/grammarGame.js';
    initTheme();
    buildGlobalSidebar({}, false);
    initGame('idioms');
  </script>
</body>
</html>
