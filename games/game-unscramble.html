<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sentence Unscramble Game - Rearrange scrambled words to form correct English sentences." />
  <meta name="theme-color" content="#06b6d4" />
  <title>Sentence Unscramble — English Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .game-layout { padding: 24px 28px; max-width: 700px; margin: 0 auto; text-align: center; }
    .unscramble-area { min-height: 70px; padding: 20px; background: var(--color-words-bg); border: 2px dashed var(--color-words-border); border-radius: var(--radius-lg); display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
    .unscramble-area .word { cursor: pointer; }
    @media (max-width: 640px) { .game-layout { padding: 16px; } }
  </style>
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header" style="background: linear-gradient(135deg, #06b6d4 0%, #0891b2 50%, #0e7490 100%);">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">📝</span>
          <div>
            <h1 class="game-title">Sentence Unscramble</h1>
            <p class="game-subtitle">Rearrange words to form correct sentences</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
        </div>
      </header>

      <div class="game-layout">
        <p style="font-size:14px;color:var(--color-text-muted);margin-bottom:12px;">Click words to move them to the sentence area. Click them to move them back.</p>

        <div class="section-header" style="justify-content:center;margin-bottom:6px;">
          <h2 class="section-title">Scrambled Words</h2>
        </div>
        <div class="unscramble-area" id="usWords"></div>

        <div style="padding:6px 0;font-size:18px;color:var(--color-text-muted);">↓</div>

        <div class="section-header" style="justify-content:center;margin-bottom:6px;">
          <h2 class="section-title">Your Sentence</h2>
        </div>
        <div class="unscramble-area" id="usDrop" style="border-color:var(--color-drop-border);background:var(--color-drop-bg);border-style:solid;">
          <div class="drop-placeholder">Click a word above to add it here…</div>
        </div>

        <div class="button-group" style="padding-top:20px;">
          <button class="btn btn-primary" id="usCheck">✓ Check</button>
          <button class="btn btn-accent" id="usHint">💡 Hint</button>
          <button class="btn btn-secondary" id="usNext">→ Next</button>
        </div>

        <div id="usResult" class="result-message" style="margin:12px 0;"></div>

        <div class="game-stats" style="display:flex;gap:20px;justify-content:center;margin:20px 0;flex-wrap:wrap;">
          <div class="game-stat" style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 24px;">
            <div class="game-stat-label" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-text-muted);">Score</div>
            <div class="game-stat-value" style="font-size:28px;font-weight:800;color:var(--color-primary);" id="usScore">0</div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>window.PAGE_TENSE = "Hub";</script>
  <script type="module" src="/src/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const UNSCRAMBLE_SENTENCES = [
        "She goes to school every day",
        "They are playing football in the park",
        "I have finished my homework",
        "He was reading a book when I arrived",
        "We will visit you next summer",
        "The cat is sitting on the mat",
        "She has been studying for three hours",
        "They went to the beach yesterday",
        "I would like a cup of coffee",
        "He does not like spicy food",
        "Are you coming to the party tonight",
        "She bought a new car last week",
        "We have been waiting for an hour",
        "The children are playing outside",
        "He had already left when I called",
        "She will be working at five PM",
        "I have never been to Japan",
        "They were playing soccer in the park",
        "She is going to visit her family",
        "He can speak three languages fluently",
      ];

      const wordArea = document.getElementById("usWords");
      const dropArea = document.getElementById("usDrop");
      const checkBtn = document.getElementById("usCheck");
      const nextBtn = document.getElementById("usNext");
      const hintBtn = document.getElementById("usHint");
      const resultEl = document.getElementById("usResult");
      const scoreEl = document.getElementById("usScore");

      let currentSentence = "";
      let score = 0;

      function shuffle(a) {
        const r = [...a];
        for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
        return r;
      }

      function loadSentence() {
        currentSentence = UNSCRAMBLE_SENTENCES[Math.floor(Math.random() * UNSCRAMBLE_SENTENCES.length)];
        wordArea.innerHTML = "";
        dropArea.innerHTML = `<div class="drop-placeholder">Click a word above to add it here…</div>`;
        shuffle(currentSentence.split(" ")).forEach(w => {
          const el = document.createElement("div");
          el.className = "word";
          el.textContent = w;
          el.addEventListener("click", () => moveToDrop(el));
          wordArea.appendChild(el);
        });
        resultEl.textContent = "";
        resultEl.className = "result-message";
      }

      function moveToDrop(el) {
        const ph = dropArea.querySelector(".drop-placeholder");
        if (ph) ph.remove();
        const clone = document.createElement("div");
        clone.className = "word droppable-word";
        clone.textContent = el.textContent;
        clone.addEventListener("click", () => {
          const newEl = document.createElement("div");
          newEl.className = "word";
          newEl.textContent = clone.textContent;
          newEl.addEventListener("click", () => moveToDrop(newEl));
          wordArea.appendChild(newEl);
          clone.remove();
          resultEl.textContent = "";
          resultEl.className = "result-message";
        });
        dropArea.appendChild(clone);
        el.remove();
      }

      checkBtn.addEventListener("click", () => {
        const words = Array.from(dropArea.children).filter(c => !c.classList.contains("drop-placeholder")).map(c => c.textContent);
        const userAnswer = words.join(" ");
        if (userAnswer.toLowerCase() === currentSentence.toLowerCase()) {
          score++;
          scoreEl.textContent = score;
          resultEl.textContent = '✓ Correct! "' + currentSentence + '."';
          resultEl.className = "result-message success";
        } else {
          resultEl.textContent = "✗ Not quite right. Try rearranging the words.";
          resultEl.className = "result-message error";
        }
      });

      hintBtn.addEventListener("click", () => {
        resultEl.textContent = '💡 Hint: The sentence is: "' + currentSentence + '."';
        resultEl.className = "result-message info";
        resultEl.style.background = "var(--color-info-bg)";
        resultEl.style.color = "var(--color-info)";
        resultEl.style.borderColor = "rgba(59,130,246,0.2)";
      });

      nextBtn.addEventListener("click", loadSentence);
      loadSentence();
    });
  </script>
</body>
</html>
