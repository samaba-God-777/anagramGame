<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Preposition Challenge - Choose the correct preposition to complete sentences." />
  <meta name="theme-color" content="#10b981" />
  <title>Preposition Challenge — English Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .game-layout { padding: 24px 28px; max-width: 700px; margin: 0 auto; text-align: center; }
    .pc-question { font-size: 24px; font-weight: 700; color: var(--color-text); margin: 30px 0; padding: 24px; background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius-lg); }
    .pc-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 400px; margin: 0 auto; }
    .pc-option { padding: 14px !important; font-size: 16px !important; justify-content: center; }
    .pc-option.correct-answer { background: var(--color-success) !important; color: #fff !important; border-color: var(--color-success) !important; }
    .pc-option.wrong-answer { background: var(--color-error) !important; color: #fff !important; border-color: var(--color-error) !important; }
    .pc-option.show-correct { background: var(--color-success) !important; color: #fff !important; border-color: var(--color-success) !important; }
    @media (max-width: 640px) { .game-layout { padding: 16px; } .pc-question { font-size: 18px; } .pc-options { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header" style="background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">📍</span>
          <div>
            <h1 class="game-title">Preposition Challenge</h1>
            <p class="game-subtitle">Choose the correct preposition</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
          <a href="../grammar/prepositions.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">📖 Theory</a>
        </div>
      </header>

      <div class="game-layout">
        <div class="pc-question" id="pcQuestion">The book is ___ the table.</div>

        <div class="pc-options" id="pcOptions"></div>

        <div class="button-group" style="padding-top:20px;">
          <button class="btn btn-secondary" id="pcNext">→ Next</button>
        </div>

        <div id="pcResult" class="result-message" style="margin:16px 0;"></div>

        <div class="game-stat" style="display:inline-block;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 24px;margin-top:12px;">
          <div class="game-stat-label" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-text-muted);">Score</div>
          <div class="game-stat-value" style="font-size:28px;font-weight:800;color:var(--color-primary);" id="pcScore">0</div>
        </div>
      </div>

      <div class="feedback-area" style="border-top:1px solid var(--color-border);">
        <div class="tip"><span class="tip-icon" aria-hidden="true">💡</span><span>Select the correct preposition to complete each sentence. Study the <a href="../grammar/prepositions.html" style="color:var(--color-primary);font-weight:600;">Preposition Theory</a> first!</span></div>
      </div>
    </main>
  </div>
  <script>window.PAGE_TENSE = "Hub";</script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
