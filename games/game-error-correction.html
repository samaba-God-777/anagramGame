<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Error Correction Game - Find and fix grammatical errors in English sentences." />
  <meta name="theme-color" content="#ef4444" />
  <title>Error Correction — English Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .game-layout { padding: 24px 28px; max-width: 700px; margin: 0 auto; text-align: center; }
    .ec-question { font-size: 22px; font-weight: 700; color: var(--color-text); margin: 30px 0; padding: 20px; background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius-lg); }
    .ec-input { padding: 12px 20px; font-size: 18px; border: 2px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); font-family: var(--font); width: 100%; max-width: 500px; }
    .ec-input:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--shadow-glow); }
    @media (max-width: 640px) { .game-layout { padding: 16px; } .ec-question { font-size: 17px; } }
  </style>
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">🔍</span>
          <div>
            <h1 class="game-title">Error Correction</h1>
            <p class="game-subtitle">Find and fix the grammar mistakes</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
        </div>
      </header>

      <div class="game-layout">
        <div style="margin-bottom:16px;">
          <select id="ecTypeFilter" style="padding:8px 14px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font-family:var(--font);font-size:14px;">
            <option value="all">All Types</option>
            <option value="Verb Tenses">Verb Tenses</option>
            <option value="Articles">Articles</option>
            <option value="Prepositions">Prepositions</option>
            <option value="Pronouns">Pronouns</option>
            <option value="Clauses">Clauses</option>
            <option value="Subject-Verb Agreement">Subject-Verb Agreement</option>
          </select>
        </div>

        <div class="ec-question" id="ecQuestion">"She go to school every day."</div>

        <div>
          <input type="text" class="ec-input" id="ecInput" placeholder="Type the corrected sentence..." autocomplete="off" />
        </div>

        <div class="button-group" style="padding-top:20px;">
          <button class="btn btn-primary" id="ecCheck">✓ Check</button>
          <button class="btn btn-secondary" id="ecNext">→ Next</button>
        </div>

        <div id="ecResult" class="result-message" style="margin:16px 0;"></div>

        <div class="game-stats" style="display:flex;gap:20px;justify-content:center;margin:20px 0;flex-wrap:wrap;">
          <div class="game-stat" style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 20px;">
            <div class="game-stat-label" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-text-muted);">Score</div>
            <div class="game-stat-value" style="font-size:24px;font-weight:800;color:var(--color-primary);" id="ecScore">0</div>
          </div>
          <div class="game-stat" style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 20px;">
            <div class="game-stat-label" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-text-muted);">Progress</div>
            <div class="game-stat-value" style="font-size:18px;font-weight:700;color:var(--color-text);" id="ecProgress">Score: 0 | Attempts: 0</div>
          </div>
        </div>
      </div>

      <div class="feedback-area" style="border-top:1px solid var(--color-border);">
        <div class="tip"><span class="tip-icon" aria-hidden="true">💡</span><span>Read the sentence, identify the error, then type the corrected version. Filter by error type!</span></div>
      </div>
    </main>
  </div>
  <script>window.PAGE_TENSE = "Hub";</script>
  <script src="../script.js"></script>
  <script>document.addEventListener("DOMContentLoaded", initErrorCorrectionGame);</script>
</body>
</html>
