<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Clause Identification Game - Identify noun clauses, adjective clauses, and adverb clauses in sentences." />
  <meta name="theme-color" content="#8b5cf6" />
  <title>Clause Identification — English Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .game-layout { padding: 24px 28px; max-width: 700px; margin: 0 auto; text-align: center; }
    .ci-question { font-size: 18px; font-weight: 500; color: var(--color-text); margin: 24px 0; padding: 24px; background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius-lg); }
    .ci-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; max-width: 500px; margin: 0 auto; }
    .ci-option { padding: 14px !important; font-size: 15px !important; justify-content: center; }
    .ci-option.correct-answer { background: var(--color-success) !important; color: #fff !important; border-color: var(--color-success) !important; }
    .ci-option.wrong-answer { background: var(--color-error) !important; color: #fff !important; border-color: var(--color-error) !important; }
    .ci-option.show-correct { background: var(--color-success) !important; color: #fff !important; border-color: var(--color-success) !important; }
    @media (max-width: 640px) { .game-layout { padding: 16px; } .ci-question { font-size: 16px; } .ci-options { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <main class="main-content">
      <header class="game-header" style="background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 50%, #6d28d9 100%);">
        <div class="header-left">
          <span class="game-icon" aria-hidden="true">🔗</span>
          <div>
            <h1 class="game-title">Clause Identification</h1>
            <p class="game-subtitle">Identify noun, adjective and adverb clauses</p>
          </div>
        </div>
        <div class="header-controls">
          <a href="../index.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">🏠 Home</a>
          <a href="../grammar/clauses.html" class="stat-badge" style="text-decoration:none;color:#fff;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;">📖 Theory</a>
        </div>
      </header>

      <div class="game-layout">
        <div class="ci-question" id="ciQuestion">Identify the clause type:<br><span style="font-size:20px;font-weight:600;color:var(--color-text);display:block;margin-top:10px;">"What she said surprised everyone."</span></div>

        <div class="ci-options" id="ciOptions"></div>

        <div class="button-group" style="padding-top:20px;">
          <button class="btn btn-secondary" id="ciNext">→ Next</button>
        </div>

        <div id="ciResult" class="result-message" style="margin:16px 0;"></div>

        <div class="game-stat" style="display:inline-block;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 24px;margin-top:12px;">
          <div class="game-stat-label" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-text-muted);">Score</div>
          <div class="game-stat-value" style="font-size:28px;font-weight:800;color:var(--color-primary);" id="ciScore">0</div>
        </div>
      </div>

      <div class="feedback-area" style="border-top:1px solid var(--color-border);">
        <div class="tip"><span class="tip-icon" aria-hidden="true">💡</span><span>Identify whether the highlighted clause is a noun, adjective, or adverb clause. Study the <a href="../grammar/clauses.html" style="color:var(--color-primary);font-weight:600;">Clause Theory</a> first!</span></div>
      </div>
    </main>
  </div>
  <script>window.PAGE_TENSE = "Hub";</script>
  <script type="module" src="/src/main.js"></script>
  <script>document.addEventListener("DOMContentLoaded", initClauseIdentificationGame);</script>
</body>
</html>
